name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 0


      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $username = "AAtmg26"
          $plainPassword = "Aa@123456789!"
          $password = ConvertTo-SecureString $plainPassword -AsPlainText -Force

          # Remove old user if exists
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $username
          }

          # Create new admin user
          New-LocalUser `
            -Name $username `
            -Password $password `
            -FullName "RDP Admin" `
            -Description "Cloud RDP Account" `
            -PasswordNeverExpires

          # Add administrator privileges
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username

          # Verify
          Get-LocalUser -Name $username

          Write-Host "================================="
          Write-Host "User Created Successfully"
          Write-Host "Username: $username"
          Write-Host "Password: $plainPassword"
          Write-Host "================================="


      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          Invoke-WebRequest `
          "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
          -OutFile "C:\tailscale.msi"

          Start-Process msiexec `
          -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
          -Wait


          Start-Sleep -Seconds 5


          & "C:\Program Files\Tailscale\tailscale.exe" up `
          --authkey="$Env:TAILSCALE_AUTHKEY" `
          --hostname="github-rdp-server"


          Start-Sleep -Seconds 10


          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4


          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host "        RDP SERVER IS READY" -ForegroundColor Cyan
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : AAtmg26" -ForegroundColor Yellow
          Write-Host "Password     : Aa@123456789!" -ForegroundColor Yellow
          Write-Host "Connect via  : mstsc -> $ts_ip" -ForegroundColor Magenta
          Write-Host "==============================================" -ForegroundColor Green


      - name: 4. Keep Server Alive (48 Hours)
        shell: powershell
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
